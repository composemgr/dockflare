# nginx proxy address - http://172.17.0.1:64154

name: dockflare
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: alplat/dockflare:latest
    container_name: dockflare-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: dockflare-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      REDIS_URL: redis://dockflare-redis:6379/0
      DOCKER_HOST: tcp://dockflare-socket-proxy:2375
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/5000']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64154:5000'
    volumes:
      - './volumes/data/dockflare:/app/data:z'
    depends_on:
      - dockflare-redis
      - dockflare-socket-proxy
    networks:
      - dockflare

  dockflare-redis:
    image: redis:alpine
    container_name: dockflare-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: dockflare-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: dockflare-redis
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/db/redis/dockflare:/data:z'
    networks:
      - dockflare

  dockflare-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockflare-socket-proxy
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: dockflare-socket-proxy
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: dockflare-socket-proxy
      CONTAINERS: 1
      EVENTS: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
      PING: 1
      INFO: 1
      EXEC: 1
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '2375']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    networks:
      - dockflare

networks:
  dockflare:
    name: dockflare
    external: false
